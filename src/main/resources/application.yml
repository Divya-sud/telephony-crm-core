server:
  port: ${PORT:8080}

spring:
  application:
    name: telephony-crm-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telephony_crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:crm_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

grok:
  api-key: ${GROK_API_KEY:YOUR_GROK_API_KEY}

telephony:
  asterisk:
    base-url: ${TELEPHONY_ASTERISK_BASE_URL:http://localhost:8088/ari}
    username: ${TELEPHONY_ASTERISK_USERNAME:asterisk}
    password: ${TELEPHONY_ASTERISK_PASSWORD:asteriskpassword}
    app-name: ${TELEPHONY_ASTERISK_APP_NAME:crm-dialer}

whatsapp:
  api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:YOUR_META_PHONE_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN:YOUR_META_TOKEN}